version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: satquery_db
    environment:
      - POSTGRES_USER=satquery
      - POSTGRES_PASSWORD=satquery_pass
      - POSTGRES_DB=satquery_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: satquery_redis
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
